schema_version: "1.1"
name: smart-goals-indicators
expected_outcome: |
  The mentor shows why the current goals are intentions, not measurable goals, and rewrites them (or a pattern for them) as SMART goals each with an indicator, baseline (or a plan to measure it), target, data source, who measures, and timeframe. It does not invent Port Sudan statistics; missing baselines are flagged and turned into a first-month measurement step. It links goals back to the problem and asks the writer for the information only they have.
